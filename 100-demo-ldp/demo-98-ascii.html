<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII - CuongHoa.AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00ff00;
            /* Classic Terminal Green */
            font-family: monospace;
            font-size: 10px;
            /* Small font for better resolution */
            white-space: pre;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            line-height: 0.8;
            user-select: none;
        }

        .ascii-canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.3;
            z-index: 0;
            width: 100%;
            height: 100%;
            font-size: 8px;
            overflow: hidden;
        }

        .main-art {
            position: relative;
            z-index: 10;
            background: #000;
            padding: 2rem;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
        }

        .big-text {
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
        }

        a {
            color: #000;
            background: #00ff00;
            text-decoration: none;
            padding: 5px 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            font-size: 14px;
        }

        a:hover {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }
    </style>
</head>

<body>

    <div class="ascii-canvas" id="bg">
        <!-- JS will flood this -->
    </div>

    <div class="main-art">
        <div class="big-text">
            ______ __ __
            / \ | \ | \
            | $$$$$$\ | $$ | $$
            | $$__| $$ | $$ | $$
            | $$ $$ \$$\ / $$
            | $$$$$$$$ \$$\ $$
            | $$ | $$ \$$ $$
            | $$ | $$ \$$$
            \$$ \$$ \$

        </div>
        <div style="font-size: 14px; line-height: 1.2;">
            [SYSTEM ONLINE]
            [RENDERING GRAPHICS...] FAILED.
            [FALLBACK MODE] ACTIVE.

            > IMAGE IS OVERRATED.
            > TEXT IS TRUTH.
        </div>

        <a href="https://www.cuonghoa.website">[ EXECUTE.EXE ]</a>
    </div>

    <script>
        const chars = "0101010101 .:;=+*#%@";
        const bg = document.getElementById('bg');

        function fillBg() {
            let str = "";
            const rows = Math.ceil(window.innerHeight / 8);
            const cols = Math.ceil(window.innerWidth / 5);

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    str += chars[Math.floor(Math.random() * chars.length)];
                }
                str += "\n";
            }
            bg.innerText = str;
        }

        fillBg();
        // Animate poorly (intentionally retro)
        setInterval(fillBg, 500);
    </script>
</body>

</html>
