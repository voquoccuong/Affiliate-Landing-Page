<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illusion - CuongHoa.AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Cafe Wall Illusion / Scintillating Grid */
        .illusion-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                repeating-linear-gradient(90deg, #000 0, #000 20px, #fff 20px, #fff 40px),
                repeating-linear-gradient(0deg, #888 0, #888 2px, transparent 2px, transparent 40px);
            background-blend-mode: multiply;
            /* Animation to make it dizzying */
            animation: moveGrid 60s linear infinite;
            z-index: 0;
            opacity: 0.1;
        }

        @keyframes moveGrid {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Hypnotic Spirals */
        .spiral {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0);
            animation: spin 3s linear infinite;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .spiral-inner {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: conic-gradient(#fff 25%, #000 0 50%, #fff 0 75%, #000 0);
            animation: spin-rev 3s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-rev {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(-360deg);
            }
        }

        .content {
            position: relative;
            z-index: 10;
            background: #fff;
            padding: 3rem;
            text-align: center;
            border: 4px solid #000;
            max-width: 400px;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 5px;
            mix-blend-mode: exclusion;
        }

        p {
            margin: 1.5rem 0;
            font-weight: bold;
        }

        .btn-magic {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 1rem 2rem;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid #000;
        }

        .btn-magic:hover {
            background: #fff;
            color: #000;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="illusion-bg"></div>

    <div class="spiral">
        <div class="spiral-inner">
            <div class="content">
                <h1>Focus</h1>
                <p>Is it moving? Or is it your mind? Perception is reality.</p>
                <a href="https://www.cuonghoa.website" class="btn-magic">BREAK THE SPELL</a>
            </div>
        </div>
    </div>

</body>

</html>
