<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Wrap - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(45deg, #ff0000 25%, transparent 25%, transparent 75%, #ff0000 75%, #ff0000),
                linear-gradient(45deg, #ff0000 25%, transparent 25%, transparent 75%, #ff0000 75%, #ff0000);
            background-color: #ffffff;
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.1;
            z-index: 0;
        }

        .content-box {
            position: relative;
            background: #fff;
            padding: 4rem;
            max-width: 600px;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* Plastic Wrap Effect */
        .wrapped {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 20;
            /* Highlights and wrinkles */
            background-image:
                linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, transparent 40%, transparent 60%, rgba(255, 255, 255, 0.4) 100%),
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 20%);
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            filter: contrast(150%) brightness(110%);
        }

        /* Wrinkle lines */
        .wrinkle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            filter: blur(2px);
            z-index: 21;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #111;
            position: relative;
            z-index: 5;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.4;
            color: #333;
            margin-bottom: 2rem;
        }

        .cta-btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 1rem 3rem;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
            z-index: 30;
            /* Above plastic to be clickable, or use pointer-events: none on wrap */
        }

        /* Sticker */
        .sticker {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 120px;
            height: 120px;
            background: #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transform: rotate(15deg);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 25;
            font-size: 1.2rem;
            text-align: center;
            line-height: 1.1;
        }
    </style>
</head>

<body>

    <div class="bg-pattern"></div>

    <div class="content-box">
        <div class="wrapped">
            <!-- Simulated wrinkles -->
            <div class="wrinkle" style="width: 200px; height: 10px; top: 20%; left: 10%; transform: rotate(10deg);">
            </div>
            <div class="wrinkle" style="width: 150px; height: 5px; bottom: 30%; right: 10%; transform: rotate(-5deg);">
            </div>
            <div class="wrinkle"
                style="width: 300px; height: 20px; top: 50%; left: -20px; transform: rotate(45deg); opacity: 0.5;">
            </div>
        </div>

        <div class="sticker">
            NEW<br>ARRIVAL
        </div>

        <h1>Fresh<br>Goods</h1>
        <p>Sealed for freshness. Transparent pricing. Keep your business sanitary and clean.</p>

        <a href="https://www.cuonghoa.website" class="cta-btn">Unwrap Deal</a>
    </div>

</body>

</html>
