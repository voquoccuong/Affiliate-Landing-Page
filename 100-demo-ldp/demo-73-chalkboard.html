<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalkboard - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&display=swap');

        :root {
            --board: #2B3A2B;
            --chalk-white: #F8F8F8;
            --chalk-yellow: #FFF59D;
            --chalk-pink: #F48FB1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--board);
            color: var(--chalk-white);
            font-family: 'Kalam', cursive;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Chalkboard Texture */
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.1"/></svg>');
        }

        .board-frame {
            border: 15px solid #5D4037;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 900px;
            min-height: 600px;
            position: relative;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Chalk dust */
        .board-frame::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1), transparent 70%);
            pointer-events: none;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 5rem;
            text-align: center;
            margin-bottom: 1rem;
            transform: rotate(-2deg);
            color: var(--chalk-white);
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.3);
            /* Chalk thickness */
        }

        .plan-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .list {
            list-style: none;
            padding-left: 1rem;
            font-size: 1.5rem;
        }

        .list li {
            margin-bottom: 1rem;
            position: relative;
        }

        .list li::before {
            content: '•';
            color: var(--chalk-pink);
            margin-right: 10px;
        }

        .diagram {
            border: 2px dashed var(--chalk-white);
            border-radius: 50% 40% 60% 50% / 50% 60% 30% 60%;
            /* Imperfect circle */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 2rem;
            transform: rotate(2deg);
        }

        .arrow {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            position: absolute;
            color: var(--chalk-yellow);
        }

        .cta-chalk {
            display: block;
            width: fit-content;
            margin: 3rem auto 0;
            font-size: 2rem;
            color: var(--chalk-yellow);
            text-decoration: none;
            border-bottom: 3px solid var(--chalk-yellow);
            padding-bottom: 5px;
            transition: all 0.2s;
        }

        .cta-chalk:hover {
            color: white;
            border-color: white;
            transform: scale(1.1);
        }

        .eraser {
            position: absolute;
            bottom: -25px;
            right: 100px;
            width: 100px;
            height: 40px;
            background: #333;
            border-top: 5px solid #999;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="board-frame">
        <h1>The Master Plan</h1>

        <div class="plan-grid">
            <div>
                <h3>To Do List:</h3>
                <ul class="list">
                    <li>Brainstorm Ideas</li>
                    <li>Sketch heavily</li>
                    <li><span style="text-decoration: line-through; opacity: 0.7;">Make Mistakes</span></li>
                    <li style="color: var(--chalk-yellow)">Succeed!</li>
                </ul>
            </div>

            <div style="position: relative;">
                <div class="diagram">
                    <span style="font-size: 3rem;">Idea</span>
                    <span style="font-size: 1rem;">(The Spark)</span>
                </div>
                <!-- Crudely drawn arrow -->
                <div style="position: absolute; top: 10px; right: -10px; font-size: 4rem; transform: rotate(45deg);">↝
                </div>
            </div>
        </div>

        <a href="https://www.cuonghoa.website" class="cta-chalk">Sign Up Today!</a>

        <div class="eraser"></div>
    </div>

</body>

</html>
