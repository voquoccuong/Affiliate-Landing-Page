<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stained Glass - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #111;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        /* Light source behind */
        .light-source {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2), #000 80%);
            z-index: 0;
        }

        .window-frame {
            position: relative;
            width: 400px;
            height: 600px;
            border-radius: 200px 200px 0 0;
            background: #000;
            padding: 10px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            z-index: 10;
        }

        .glass {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Colors */
        .g-red {
            background: rgba(200, 0, 0, 0.6);
        }

        .g-blue {
            background: rgba(0, 0, 200, 0.6);
        }

        .g-yel {
            background: rgba(200, 200, 0, 0.6);
        }

        .g-grn {
            background: rgba(0, 200, 0, 0.6);
        }

        .g-pur {
            background: rgba(200, 0, 200, 0.6);
        }

        /* Lead borders are the grid gaps + background black */

        .top-left {
            border-radius: 190px 0 0 0;
        }

        .top-right {
            border-radius: 0 190px 0 0;
        }

        .content-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            z-index: 20;
            width: 80%;
            background: rgba(0, 0, 0, 0.4);
            padding: 2rem;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 1rem 0;
            letter-spacing: 2px;
        }

        .shine-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .shine-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Projected colored light on floor/shadow */
        .projection {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%) perspective(500px) rotateX(60deg);
            width: 400px;
            height: 200px;
            background: linear-gradient(to bottom,
                    rgba(200, 0, 0, 0.2),
                    rgba(0, 0, 200, 0.2),
                    rgba(0, 200, 0, 0.2));
            filter: blur(20px);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="light-source"></div>

    <div class="window-frame">
        <div class="glass g-red top-left"></div>
        <div class="glass g-blue top-right"></div>
        <div class="glass g-yel"></div>
        <div class="glass g-grn"></div>
        <div class="glass g-pur"></div>
        <div class="glass g-red"></div>
    </div>

    <div class="content-overlay">
        <h1>Illumination</h1>
        <p>Let the light shine through your work. Vibrant colors and transparency create a masterpiece.</p>
        <a href="https://www.cuonghoa.website" class="shine-btn">See The Light</a>
    </div>

    <div class="projection"></div>

</body>

</html>
