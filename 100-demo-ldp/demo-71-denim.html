<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denim Style - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Roboto+Condensed:wght@400;700&display=swap');

        :root {
            --denim-blue: #2B4E84;
            --stitch-orange: #Cca43b;
            --white-label: #EAEAEA;
            --red-tag: #AA1111;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--denim-blue);
            font-family: 'Roboto Condensed', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://www.transparenttextures.com/patterns/denim.png');
            /* Texture needed for full effect preferably */
            overflow-x: hidden;
        }

        /* Pure CSS Denim Texture fallback */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255, 255, 255, 0.05) 3px, transparent 4px),
                repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0, 0, 0, 0.1) 3px, transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        .pocket {
            background-color: #26467A;
            width: 400px;
            padding: 3rem 2rem 5rem 2rem;
            position: relative;
            clip-path: polygon(0% 0%, 100% 0%, 100% 85%, 50% 100%, 0% 85%);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Stitching */
        .pocket::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed var(--stitch-orange);
            clip-path: polygon(0% 0%, 100% 0%, 100% 86%, 50% 99%, 0% 86%);
            pointer-events: none;
        }

        /* Double Stitching */
        .pocket::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 2px dashed var(--stitch-orange);
            clip-path: polygon(0% 0%, 100% 0%, 100% 86%, 50% 99%, 0% 86%);
            pointer-events: none;
        }

        .red-tag {
            position: absolute;
            top: 50px;
            right: -10px;
            background: var(--red-tag);
            color: white;
            font-family: 'Permanent Marker', cursive;
            padding: 5px 15px;
            transform: rotate(90deg);
            font-size: 0.8rem;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            margin: 0;
            transform: rotate(-2deg);
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.2rem;
            margin-top: 1.5rem;
            line-height: 1.4;
            color: #ddd;
        }

        .leather-patch {
            background: #8B4513;
            color: #3e1e07;
            padding: 10px 20px;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 5px 10px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .leather-patch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 1px dashed #d9a066;
            border-radius: 2px;
        }

        .buy-btn {
            display: block;
            background: var(--white-label);
            color: #333;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            border: 1px dotted #ccc;
            transform: rotate(1deg);
            transition: transform 0.2s;
        }

        rivet {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #e0c080, #806020);
            border-radius: 50%;
            position: absolute;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }
    </style>
</head>

<body>

    <div class="pocket">
        <rivet style="top: 10px; left: 10px;"></rivet>
        <rivet style="top: 10px; right: 10px;"></rivet>

        <div class="leather-patch">ORIGINAL BRAND</div>
        <div class="red-tag">CUONGHOA</div>

        <h1>Premium<br>Quality</h1>
        <p>
            Durable, timeless, and built to last. Our designs fit perfectly and get better with age.
        </p>

        <a href="https://www.cuonghoa.website" class="buy-btn">Try It On &rarr;</a>
    </div>

</body>

</html>
