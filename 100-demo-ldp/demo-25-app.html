<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f2f2f7;
            /* iOS Grey */
            color: #1c1c1e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simulate Phone Frame for Desktop view */
        .phone-frame {
            width: 100%;
            max-width: 414px;
            /* iPhone Max width */
            height: 100%;
            max-height: 896px;
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            /* For desktop demo */
        }

        @media (max-width: 500px) {
            .phone-frame {
                border-radius: 0;
                height: 100%;
                max-width: 100%;
            }
        }

        /* Status Bar Area */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Main Scroll Area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
            /* Space for nav */
            background: #fff;
        }

        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            background-image: url('https://w.ladicdn.com/22603/image-20250909024310-u2yni.png');
            background-size: cover;
        }

        /* Search */
        .search-box {
            background: #f2f2f7;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            color: #8e8e93;
            margin-bottom: 30px;
        }

        .search-box i {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        /* Featured Card */
        .featured-card {
            background: #000;
            border-radius: 20px;
            padding: 25px;
            color: white;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .featured-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .featured-card p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .featured-btn {
            background: #2c2c2e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .featured-img {
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 150px;
            transform: rotate(-10deg);
            opacity: 0.8;
            z-index: 1;
        }

        /* Section Title */
        .sec-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .see-all {
            font-size: 0.9rem;
            color: #007aff;
            /* iOS Blue */
            font-weight: 500;
        }

        /* Horizontal Scroll */
        .h-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            margin: 0 -20px 30px -20px;
            /* Bleed to edge */
            padding: 0 20px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .h-scroll::-webkit-scrollbar {
            display: none;
        }

        .h-card {
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .h-img {
            width: 140px;
            height: 140px;
            border-radius: 16px;
            object-fit: cover;
            background: #eee;
        }

        .h-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .h-sub {
            font-size: 0.8rem;
            color: #8e8e93;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
            /* Safe area */
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8e8e93;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-item.active {
            color: #007aff;
        }

        .nav-item i {
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <div class="phone-frame">

        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 5px;">
                <i class="ph-fill ph-cell-signal-full"></i>
                <i class="ph-fill ph-wifi-high"></i>
                <i class="ph-fill ph-battery-full"></i>
            </div>
        </div>

        <div class="app-content">
            <div class="header">
                <h1>Discover</h1>
                <div class="avatar"></div>
            </div>

            <div class="search-box">
                <i class="ph-bold ph-magnifying-glass"></i>
                <span>Search courses, tools...</span>
            </div>

            <div class="featured-card">
                <h2>Automation<br>Mastery</h2>
                <p>The ultimate bundle for solopreneurs.</p>
                <button class="featured-btn">Get Started</button>
                <img src="https://w.ladicdn.com/22603/image-13-20250909040425-zw_ho.png" class="featured-img">
            </div>

            <div class="sec-title">
                <span>Popular Courses</span>
                <span class="see-all">See All</span>
            </div>

            <div class="h-scroll">
                <div class="h-card">
                    <img src="https://w.ladicdn.com/22603/image-20250909024310-u2yni.png" class="h-img">
                    <span class="h-title">Finance Bot</span>
                    <span class="h-sub">Automation</span>
                </div>
                <div class="h-card">
                    <img src="https://w.ladicdn.com/22603/image-7-20250909032248-nxwdm.png" class="h-img">
                    <span class="h-title">Content AI</span>
                    <span class="h-sub">Marketing</span>
                </div>
                <div class="h-card">
                    <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80"
                        class="h-img">
                    <span class="h-title">Sales Flow</span>
                    <span class="h-sub">Business</span>
                </div>
            </div>

            <div class="sec-title">
                <span>Your Progress</span>
            </div>

            <div class="p-3"
                style="background:#fff; border:1px solid #eee; border-radius:16px; padding:15px; display:flex; align-items:center; gap:15px;">
                <div
                    style="width:50px; height:50px; background:#e0f2fe; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#0284c7;">
                    <i class="ph-fill ph-play-circle" style="font-size:1.5rem;"></i>
                </div>
                <div>
                    <div style="font-weight:600; font-size:0.95rem;">LadiPage Systems</div>
                    <div style="font-size:0.8rem; color:#8e8e93; margin-top:2px;">12/40 Lessons Completed</div>
                    <div
                        style="width:100%; height:4px; background:#f2f2f7; border-radius:2px; margin-top:8px; width:150px;">
                        <div style="width:30%; height:100%; background:#007aff; border-radius:2px;"></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="ph-fill ph-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item">
                <i class="ph-bold ph-magnifying-glass"></i>
                <span>Search</span>
            </div>
            <div class="nav-item">
                <i class="ph-bold ph-play-circle"></i>
                <span>Learn</span>
            </div>
            <div class="nav-item">
                <i class="ph-bold ph-user"></i>
                <span>Profile</span>
            </div>
        </div>

    </div>

</body>

</html>
