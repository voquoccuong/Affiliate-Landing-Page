<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leather & Gold - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Montserrat:wght@300;500&display=swap');

        :root {
            --leather-dark: #2A1A10;
            --leather-light: #4A3020;
            --gold: #D4AF37;
            --gold-shine: #F7E7A0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--leather-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            /* Faux leather texture */
            background-image:
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.6) 100%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.1"/></svg>');
        }

        .card-leather {
            width: 500px;
            padding: 4rem;
            background: linear-gradient(135deg, #3d2618 0%, #2A1A10 100%);
            border-radius: 12px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            text-align: center;
        }

        /* Embossed Border */
        .card-leather::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 2px solid rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to bottom, var(--gold-shine), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Embossed Text Effect */
            filter: drop-shadow(0px 2px 0px rgba(0, 0, 0, 0.5));
        }

        p {
            color: #dcb;
            font-size: 1.1rem;
            margin: 2rem 0;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 2rem auto;
            width: 50%;
            opacity: 0.5;
        }

        .gold-btn {
            background: linear-gradient(to bottom, #E6C870, #D4AF37, #B8860B);
            color: #3e2723;
            text-decoration: none;
            padding: 1rem 3rem;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: transform 0.2s;
            position: relative;
            z-index: 10;
        }

        .gold-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(to bottom, #fae090, #eac146, #c9961c);
        }
    </style>
</head>

<body>

    <div class="card-leather">
        <h1>Handcrafted <br>Luxury</h1>

        <div class="divider"></div>

        <p>
            Experience the tactile sensation of true quality.
            Meticulously stitched details and rich textures that command attention.
        </p>

        <a href="https://www.cuonghoa.website" class="gold-btn">Explore Collection</a>

        <div style="margin-top: 2rem; font-size: 0.8rem; color: #886; text-transform: uppercase; letter-spacing: 3px;">
            Est. 2024</div>
    </div>

</body>

</html>
