<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Fog</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: #bcc3c9;
            /* Fog grey */
            color: #2d3436;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fog Layers */
        .fog-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .fog-img {
            position: absolute;
            height: 100vh;
            width: 300vw;
            z-index: 1;
            opacity: 0.8;
            background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png') repeat-x;
            background-size: contain;
            animation: fog 60s linear infinite;
        }

        .fog-img-2 {
            position: absolute;
            height: 100vh;
            width: 300vw;
            z-index: 2;
            opacity: 0.5;
            background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog2.png') repeat-x;
            background-size: contain;
            animation: fog 40s linear infinite;
            margin-left: -50%;
        }

        @keyframes fog {
            0% {
                transform: translate3d(0, 0, 0);
            }

            100% {
                transform: translate3d(-200vw, 0, 0);
            }
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
            color: #1a1a1a;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #4a4a4a;
        }

        .btn-fog {
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.5s;
            position: relative;
            overflow: hidden;
        }

        .btn-fog::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #1a1a1a;
            transition: all 0.5s;
            z-index: -1;
        }

        .btn-fog:hover {
            color: white;
            letter-spacing: 4px;
        }

        .btn-fog:hover::before {
            width: 100%;
        }

        /* Decorative Line */
        .line {
            width: 2px;
            height: 100px;
            background: #1a1a1a;
            margin: 0 auto 30px;
        }
    </style>
</head>

<body>

    <div class="fog-container">
        <div class="fog-img"></div>
        <div class="fog-img-2"></div>
    </div>

    <div class="content">
        <div class="line"></div>
        <h1>The Unknown</h1>
        <p>
            Beyond the visible spectrum lies infinite potential.
            Automation is not about what you can see, but what you can imagine.
            Step into the mist.
        </p>
        <button class="btn-fog">DISCOVER</button>
    </div>

</body>

</html>
