<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pop-yellow: #fff200;
            --pop-cyan: #00aeef;
            --pop-magenta: #ec008c;
            --pop-black: #000000;
        }

        body {
            background-color: var(--pop-yellow);
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(var(--pop-black) 20%, transparent 20%);
            background-size: 20px 20px;
            /* Halftone effect */
        }

        .comic-panel {
            background: white;
            border: 8px solid var(--pop-black);
            padding: 40px;
            max-width: 900px;
            position: relative;
            box-shadow: 20px 20px 0 var(--pop-black);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            transform: rotate(-2deg);
        }

        /* Speech Bubble */
        .speech-bubble {
            background: white;
            border: 4px solid var(--pop-black);
            border-radius: 50%;
            padding: 30px;
            position: absolute;
            top: -60px;
            right: -40px;
            z-index: 20;
            width: 250px;
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            line-height: 1.2;
            box-shadow: 10px 10px 0 var(--pop-cyan);
            animation: bounce 2s infinite ease-in-out;
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 20px;
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: var(--pop-black) transparent;
            display: block;
            width: 0;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Left Side */
        .poster-art {
            background: var(--pop-magenta);
            border: 4px solid var(--pop-black);
            position: relative;
            overflow: hidden;
        }

        .poster-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%);
            mix-blend-mode: multiply;
        }

        /* Right Side */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 5rem;
            line-height: 0.9;
            color: var(--pop-black);
            text-shadow: 5px 5px 0 var(--pop-cyan);
            margin-bottom: 20px;
            transform: skew(-5deg);
        }

        p {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 30px;
            background: var(--pop-black);
            color: white;
            padding: 10px;
            transform: rotate(1deg);
        }

        .btn-pop {
            display: inline-block;
            background: var(--pop-magenta);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            text-decoration: none;
            padding: 15px 40px;
            border: 4px solid var(--pop-black);
            text-transform: uppercase;
            box-shadow: 8px 8px 0 var(--pop-black);
            transition: all 0.2s;
            transform: rotate(-2deg);
        }

        .btn-pop:hover {
            transform: translate(-5px, -5px) rotate(0deg);
            box-shadow: 13px 13px 0 var(--pop-black);
            background: var(--pop-cyan);
        }

        .star-burst {
            position: absolute;
            bottom: -30px;
            left: -30px;
            background: var(--pop-yellow);
            color: var(--pop-black);
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            text-align: center;
            border: 4px solid var(--pop-black);
            /* Star shape polygon */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 30;
            transform: rotate(15deg);
        }
    </style>
</head>

<body>

    <div class="comic-panel">

        <div class="speech-bubble">
            AUTOMATION IS FOR EVERYONE!
        </div>

        <div class="star-burst">
            WOW!
        </div>

        <div class="poster-art">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"
                alt="Pop Art Portrait">
        </div>

        <div class="content">
            <h1>BOOM!<br>P0W!<br>ZAP!</h1>
            <p>Don't be a square. Join the revolution and automatize your boring tasks today!</p>
            <div>
                <a href="#" class="btn-pop">GET IT NOW!</a>
            </div>
        </div>

    </div>

</body>

</html>
