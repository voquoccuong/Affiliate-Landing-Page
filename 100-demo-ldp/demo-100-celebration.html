<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration 100 - CuongHoa.AI</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Fredoka One', cursive;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h2 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            font-weight: normal;
            margin: 0 0 2rem;
            text-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .badge {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s ease-out 0.4s backwards;
        }

        .cta-celebrate {
            background: yellow;
            color: #f5576c;
            text-decoration: none;
            padding: 1.5rem 4rem;
            font-size: 1.5rem;
            border-radius: 10px;
            box-shadow:
                0 10px 0 #e6ac00,
                0 20px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            display: inline-block;
            animation: slideUp 0.8s ease-out 0.6s backwards;
        }

        .cta-celebrate:hover {
            transform: translateY(-5px);
            box-shadow:
                0 15px 0 #e6ac00,
                0 25px 30px rgba(0, 0, 0, 0.3);
        }

        .cta-celebrate:active {
            transform: translateY(5px);
            box-shadow:
                0 5px 0 #e6ac00,
                0 10px 10px rgba(0, 0, 0, 0.2);
        }

        @keyframes pop {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Balloon */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 100px;
            height: 120px;
            background: #ffec99;
            border-radius: 50%;
            animation: floatUp 10s linear infinite;
            z-index: 0;
            opacity: 0.8;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 50px;
            background: white;
        }

        @keyframes floatUp {
            to {
                bottom: 120%;
            }
        }
    </style>
</head>

<body>

    <!-- Balloons -->
    <div class="balloon" style="left: 10%; background: #ff9a9e; animation-duration: 8s; width:80px; height:100px;">
    </div>
    <div class="balloon" style="left: 20%; background: #fecfef; animation-duration: 12s;"></div>
    <div class="balloon" style="left: 80%; background: #a18cd1; animation-duration: 9s;"></div>
    <div class="balloon" style="left: 90%; background: #84fab0; animation-duration: 11s; width:90px; height:110px;">
    </div>

    <div style="position: relative; z-index: 10;">
        <div class="badge">MISSION COMPLETE</div>
        <h1>100</h1>
        <h2>Demos Completed!</h2>
        <p style="font-family: sans-serif; opacity: 0.8; margin-bottom: 30px;">
            We have journeyed through 100 unique styles.<br>From Corporate to Abstract, Minimal to Gamified.
        </p>

        <a href="https://www.cuonghoa.website" class="cta-celebrate" onclick="party(event)">Get The Collection</a>
    </div>

    <script>
        // Auto fire confetti on load
        window.addEventListener('load', () => {
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffffff', '#ff0000', '#ffff00']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffffff', '#00ff00', '#0000ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });

        function party(e) {
            // Extra burst on click
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>

</body>

</html>
