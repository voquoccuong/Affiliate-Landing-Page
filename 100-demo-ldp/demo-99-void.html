<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void - CuongHoa.AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
            perspective: 1000px;
        }

        .abyss {
            width: 100px;
            height: 100px;
            background: #000;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 100px 20px #000;
            /* Initial darkness */
        }

        /* Fake light event horizon */
        .horizon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(transparent 50%, rgba(255, 255, 255, 0.05) 60%, transparent 70%);
            animation: pulse 5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.8;
            }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: fly 10s linear infinite;
        }

        @keyframes fly {
            from {
                transform: translateZ(-1000px);
                opacity: 0;
            }

            to {
                transform: translateZ(500px);
                opacity: 1;
            }
        }

        .content {
            position: absolute;
            text-align: center;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 3s forwards 1s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        h1 {
            color: #fff;
            font-weight: 100;
            letter-spacing: 10px;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-void {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 30px;
            text-decoration: none;
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: all 1s;
        }

        .btn-void:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <!-- Stars generation -->
    <script>
        for (let i = 0; i < 100; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            let x = (Math.random() - 0.5) * window.innerWidth;
            let y = (Math.random() - 0.5) * window.innerHeight;
            let delay = Math.random() * -10;
            s.style.left = '50%';
            s.style.top = '50%';
            s.style.marginLeft = x + 'px';
            s.style.marginTop = y + 'px';
            s.style.width = Math.random() * 2 + 'px';
            s.style.height = s.style.width;
            s.style.animationDelay = delay + 's';
            document.body.appendChild(s);
        }
    </script>

    <div class="horizon"></div>
    <div class="abyss"></div> <!-- Just to block center stars visually if needed -->

    <div class="content">
        <h1>N O T H I N G N E S S</h1>
        <a href="https://www.cuonghoa.website" class="btn-void">ENTER</a>
    </div>

</body>

</html>
