<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lato:wght@300;400&family=Playfair+Display:ital,wght@1,900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f4ece4;
            color: #1a1a1a;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
        }

        .huge-letter {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-size: 50vw;
            line-height: 0.8;
            opacity: 0.1;
            top: -10%;
            left: -10%;
            pointer-events: none;
            font-style: italic;
        }

        .left-col {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .right-col {
            background: #1a1a1a;
            color: #f4ece4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
        }

        h1 {
            font-family: 'Abril Fatface', cursive;
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
        }

        .serif {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 900;
        }

        .thin {
            font-weight: 300;
            font-family: 'Lato', sans-serif;
            letter-spacing: -2px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.5;
            max-width: 400px;
            margin-top: 2rem;
        }

        .vertical-type {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .circle-text {
            width: 150px;
            height: 150px;
            position: absolute;
            bottom: 4rem;
            right: 4rem;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: rotate 20s linear infinite;
        }

        .circle-text svg {
            width: 100%;
            height: 100%;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .btn-text {
            display: inline-block;
            margin-top: 3rem;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
            border-bottom: 2px solid currentColor;
            padding-bottom: 5px;
            width: fit-content;
        }
    </style>
</head>

<body>

    <div class="huge-letter">A</div>

    <div class="container">
        <div class="left-col">
            <h1>Making<br><span class="thin">Words</span><br><span class="serif">Matter</span></h1>
            <p>
                Typography is the voice of design. It speaks before you read.
                Structure, hierarchy, and font choice define the emotion.
            </p>
            <a href="https://www.cuonghoa.website" class="btn-text">Read More →</a>
        </div>

        <div class="right-col">
            <div class="vertical-type">Constructed / Deconstructed / Reconstructed</div>

            <p style="font-family: 'Playfair Display'; font-size: 2rem; line-height: 1.2;">
                "Type is a beautiful group of letters, not a group of beautiful letters."
            </p>

            <div class="circle-text">
                <svg viewBox="0 0 100 100">
                    <path id="curve" d="M 50 50 m -37 0 a 37 37 0 1 1 74 0 a 37 37 0 1 1 -74 0" fill="transparent" />
                    <text font-size="11.5" fill="white" letter-spacing="2">
                        <textPath href="#curve">
                            CUONGHOA DESIGN * TYPE *
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
    </div>

</body>

</html>
