<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Roboto:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #220022;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Righteous', cursive;
            overflow: hidden;
            /* Casino carpet pattern */
            background-image: radial-gradient(circle, #550055 20%, transparent 20%), radial-gradient(circle, #550055 20%, transparent 20%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        .machine {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            padding: 30px;
            border-radius: 40px;
            box-shadow:
                0 0 50px rgba(255, 200, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.5),
                0 20px 0 #cc7700;
            position: relative;
            width: 600px;
            text-align: center;
        }

        .screen-border {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px #000;
        }

        .reels-container {
            background: #fff;
            height: 200px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            overflow: hidden;
            border-radius: 5px;
            position: relative;
        }

        .reels-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, transparent 30%, transparent 70%, rgba(0, 0, 0, 0.6) 100%);
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .reel {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Static for demo, typically animated */
            transform: translateY(-50px);
        }

        .icon {
            font-size: 80px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        /* Payline */
        .payline {
            position: absolute;
            top: 50%;
            left: -20px;
            right: -20px;
            height: 4px;
            background: red;
            z-index: 10;
            box-shadow: 0 0 10px red;
            opacity: 0.7;
        }

        h1 {
            margin: 0 0 20px;
            color: #590059;
            font-size: 3rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.4);
        }

        .lever-base {
            position: absolute;
            right: -60px;
            bottom: 100px;
            width: 40px;
            height: 100px;
            background: #999;
            border-radius: 0 10px 10px 0;
            border: 2px solid #555;
            z-index: -1;
        }

        .lever-arm {
            position: absolute;
            right: -20px;
            top: 10px;
            width: 20px;
            height: 150px;
            background: linear-gradient(to right, #ccc, #fff, #ccc);
            transform-origin: bottom center;
            transform: rotate(-10deg);
        }

        .lever-knob {
            position: absolute;
            top: -30px;
            left: -15px;
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-spin {
            background: linear-gradient(to bottom, #ff3333, #aa0000);
            color: white;
            border: none;
            padding: 1rem 4rem;
            font-size: 2rem;
            font-family: 'Righteous', cursive;
            border-radius: 50px;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 10px 0 #550000;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: all 0.1s;
        }

        .btn-spin:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #550000;
        }

        .lights {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .bulb {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: blink 0.5s infinite alternate;
        }

        .bulb:nth-child(even) {
            animation-delay: 0.5s;
        }

        @keyframes blink {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="machine">

        <div class="lights">
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
            <div class="bulb"></div>
        </div>

        <h1>Lucky Spin</h1>

        <div class="screen-border">
            <div class="reels-container">
                <div class="payline"></div>

                <div class="reel">
                    <div class="icon">🍒</div>
                    <div class="icon">💎</div> <!-- Winner -->
                    <div class="icon">🍋</div>
                </div>
                <div class="reel">
                    <div class="icon">7️⃣</div>
                    <div class="icon">💎</div> <!-- Winner -->
                    <div class="icon">🔔</div>
                </div>
                <div class="reel">
                    <div class="icon">🍇</div>
                    <div class="icon">💎</div> <!-- Winner -->
                    <div class="icon">👑</div>
                </div>
            </div>
        </div>

        <a href="https://www.cuonghoa.website" class="btn-spin">CLAIM PRIZE</a>

        <div class="lever-base">
            <div class="lever-arm">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

</body>

</html>
