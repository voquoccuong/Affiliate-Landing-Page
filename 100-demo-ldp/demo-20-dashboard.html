<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #f4f6f8;
            color: #212b36;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: #fff;
            border-right: 1px dashed #dfe3e8;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #00AB55;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            color: #637381;
            font-weight: 600;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item.active {
            background-color: rgba(0, 171, 85, 0.08);
            color: #00AB55;
        }

        .nav-item:hover {
            background-color: rgba(99, 115, 129, 0.08);
        }

        .nav-item i {
            margin-right: 16px;
            font-size: 22px;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #dfe3e8;
            background-image: url('https://w.ladicdn.com/22603/image-20250909024310-u2yni.png');
            background-size: cover;
        }

        .scroll-content {
            padding: 40px;
            overflow-y: auto;
            flex: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 2px 0 rgba(145, 158, 171, 0.2), 0 12px 24px -4px rgba(145, 158, 171, 0.12);
            display: flex;
            align-items: center;
        }

        .stat-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-right: 20px;
        }

        .stat-info .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-info .label {
            color: #637381;
            font-weight: 600;
        }

        /* Modules Section */
        .modules-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .chart-box {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 2px 0 rgba(145, 158, 171, 0.2), 0 12px 24px -4px rgba(145, 158, 171, 0.12);
        }

        .upgrade-list {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 2px 0 rgba(145, 158, 171, 0.2), 0 12px 24px -4px rgba(145, 158, 171, 0.12);
        }

        .module-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #dfe3e8;
        }

        .module-item:last-child {
            border-bottom: none;
        }

        .module-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #f4f6f8;
            margin-right: 15px;
            object-fit: cover;
        }

        .module-details {
            flex: 1;
        }

        .module-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .module-meta {
            font-size: 0.8rem;
            color: #637381;
        }

        .btn-upgrade {
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(0, 171, 85, 0.1);
            color: #00AB55;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-upgrade:hover {
            background: #00AB55;
            color: white;
        }
    </style>
</head>

<body>

    <aside>
        <div class="logo">
            <i class="ph-fill ph-circles-three-plus"></i> CuongHoa
        </div>

        <nav>
            <div class="nav-item active">
                <i class="ph-duotone ph-chart-pie-slice"></i> Overview
            </div>
            <div class="nav-item">
                <i class="ph-duotone ph-graduation-cap"></i> My Learning
            </div>
            <div class="nav-item">
                <i class="ph-duotone ph-robot"></i> Automations
            </div>
            <div class="nav-item">
                <i class="ph-duotone ph-gear"></i> Settings
            </div>
        </nav>

        <div style="margin-top: auto; background: #e0f2f1; padding: 20px; border-radius: 12px; text-align: center;">
            <div
                style="width: 40px; height: 40px; background: #00AB55; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin: 0 auto 10px;">
                <i class="ph-bold ph-lightning"></i>
            </div>
            <h4 style="margin-bottom: 5px;">Go Pro</h4>
            <p style="font-size: 0.8rem; color: #637381; margin-bottom: 15px;">Unlock all automation modules.</p>
            <button
                style="background: #00AB55; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">Upgrade
                Now</button>
        </div>
    </aside>

    <main>
        <header>
            <div style="margin-right: 20px;">
                <i class="ph-bold ph-bell" style="font-size: 24px; color: #637381;"></i>
            </div>
            <div class="avatar"></div>
        </header>

        <div class="scroll-content">
            <h2>Hi, Future Automator 👋</h2>

            <div class="stats-grid">
                <!-- Stat 1 -->
                <div class="stat-card">
                    <div class="stat-icon" style="background: #e4f8dd; color: #00AB55;">
                        <i class="ph-fill ph-clock"></i>
                    </div>
                    <div class="stat-info">
                        <div class="value">0h</div>
                        <div class="label">Time Saved</div>
                    </div>
                </div>

                <!-- Stat 2 -->
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fff7cd; color: #b78103;">
                        <i class="ph-fill ph-currency-dollar"></i>
                    </div>
                    <div class="stat-info">
                        <div class="value">0đ</div>
                        <div class="label">Cost Reduced</div>
                    </div>
                </div>

                <!-- Stat 3 -->
                <div class="stat-card">
                    <div class="stat-icon" style="background: #d6e4ff; color: #1939b7;">
                        <i class="ph-fill ph-chart-bar"></i>
                    </div>
                    <div class="stat-info">
                        <div class="value">0%</div>
                        <div class="label">Efficiency</div>
                    </div>
                </div>
            </div>

            <div class="modules-section">
                <div class="chart-box">
                    <h3 style="font-size: 1.1rem; margin-bottom: 20px;">Projected Growth (Manual vs Auto)</h3>
                    <canvas id="growthChart" height="200"></canvas>
                </div>

                <div class="upgrade-list">
                    <h3 style="font-size: 1.1rem; margin-bottom: 20px;">Recommended Upgrades</h3>

                    <div class="module-item">
                        <img src="https://w.ladicdn.com/22603/image-13-20250909040425-zw_ho.png" class="module-thumb">
                        <div class="module-details">
                            <div class="module-name">Automation Mindset</div>
                            <div class="module-meta">Prerequisite</div>
                        </div>
                        <button class="btn-upgrade">Install</button>
                    </div>

                    <div class="module-item">
                        <img src="https://w.ladicdn.com/22603/image-20250909024310-u2yni.png" class="module-thumb">
                        <div class="module-details">
                            <div class="module-name">Finance Bot</div>
                            <div class="module-meta">Plugin</div>
                        </div>
                        <button class="btn-upgrade">Install</button>
                    </div>

                    <div class="module-item">
                        <img src="https://w.ladicdn.com/22603/image-7-20250909032248-nxwdm.png" class="module-thumb">
                        <div class="module-details">
                            <div class="module-name">AI Content Core</div>
                            <div class="module-meta">Plugin</div>
                        </div>
                        <button class="btn-upgrade">Install</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('growthChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [
                    {
                        label: 'With Automation',
                        data: [100, 150, 300, 450, 800, 1200],
                        borderColor: '#00AB55',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(0, 171, 85, 0.1)'
                    },
                    {
                        label: 'Manual Process',
                        data: [100, 110, 120, 130, 140, 150],
                        borderColor: '#FF4842',
                        tension: 0.4,
                        borderDash: [5, 5]
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>

</html>
