<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardboard Pack - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime&display=swap');

        :root {
            --cardboard: #d6b485;
            --cardboard-dark: #b8966c;
            --ink-black: #222;
            --tape-clear: rgba(255, 255, 230, 0.4);
            --sticker-white: #f5f5f5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--cardboard);
            font-family: 'Courier Prime', monospace;
            color: var(--ink-black);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://www.transparenttextures.com/patterns/cardboard.png');
            /* Texture implies */
            overflow: hidden;
        }

        /* Corrugated Texture Lines */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0, 0, 0, 0.03) 5px, transparent 6px);
            pointer-events: none;
        }

        .box-face {
            width: 600px;
            height: 700px;
            background-color: var(--cardboard);
            border: 2px solid rgba(0, 0, 0, 0.1);
            position: relative;
            box-shadow: 10px 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem;
            box-sizing: border-box;
            background-image: url('https://www.transparenttextures.com/patterns/cardboard.png');
        }

        /* Tape */
        .tape {
            position: absolute;
            background: var(--tape-clear);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: brightness(1.05);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            z-index: 10;
        }

        .tape-top {
            top: -20px;
            left: 30%;
            width: 100px;
            height: 150px;
        }

        .tape-bottom {
            bottom: -20px;
            right: 20%;
            width: 80px;
            height: 120px;
            transform: rotate(5deg);
        }

        .fragile-stamp {
            border: 5px solid var(--ink-black);
            padding: 10px 20px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            transform: rotate(-15deg);
            opacity: 0.8;
            margin-bottom: 2rem;
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="1.5"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.8"/></svg>');
        }

        .barcode {
            font-family: 'Libre Barcode 39', cursive;
            /* If available, else fallback */
            font-size: 4rem;
            margin-top: auto;
            transform: scaleY(1.5);
            opacity: 0.9;
        }

        .sticker-label {
            background: var(--sticker-white);
            padding: 1.5rem;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            width: 80%;
            transform: rotate(1deg);
            margin: 2rem 0;
            position: relative;
        }

        .sticker-label::after {
            content: 'PRIORITY';
            position: absolute;
            top: -10px;
            right: -10px;
            background: red;
            color: white;
            font-size: 0.7rem;
            padding: 2px 5px;
            font-weight: bold;
        }

        h2 {
            font-size: 2rem;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
        }

        p {
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .btn-open {
            background: black;
            color: white;
            padding: 1rem 2rem;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            display: inline-block;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .btn-open:hover {
            transform: scale(1.05);
        }

        /* Recycle Icon - Simple CSS shapes */
        .recycle {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <div class="box-face">
        <div class="tape tape-top"></div>
        <div class="tape tape-bottom"></div>

        <div class="recycle">♻</div>

        <div class="fragile-stamp">HANDLE WITH CARE</div>

        <div class="sticker-label">
            <h2>Delivery for You</h2>
            <p><strong>Tracking:</strong> #CH-882910</p>
            <p><strong>Contents:</strong> Creative ideas, packaged with sustainability in mind. 100% Recyclable code.
            </p>

            <a href="https://www.cuonghoa.website" class="btn-open">UNBOX NOW</a>
        </div>

        <div class="barcode">
            || ||| || ||| || |||
        </div>
        <div style="font-size: 0.8rem; letter-spacing: 5px;">12345 67890</div>
    </div>

</body>

</html>
