<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negative Space - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 80%;
            height: 80%;
            position: relative;
        }

        /* The Tiny Content */
        .content {
            position: absolute;
            bottom: 5rem;
            right: 5rem;
            text-align: right;
            max-width: 300px;
        }

        .tiny-text {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
            line-height: 1.6;
        }

        .cta {
            display: inline-block;
            font-weight: 700;
            text-decoration: none;
            color: black;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* The Massive Element (or lack thereof) */
        .void-shape {
            position: absolute;
            top: 5rem;
            left: 5rem;
            font-size: 15vw;
            /* Massive */
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -0.05em;
        }

        .line {
            display: block;
        }

        /* Subtle grid to emphasize emptiness elsewhere */
        .grid-line {
            position: absolute;
            background: rgba(0, 0, 0, 0.05);
        }

        .v-line {
            width: 1px;
            height: 100vh;
            left: 50%;
            top: 0;
        }

        .h-line {
            height: 1px;
            width: 100vw;
            top: 50%;
            left: 0;
        }

        .dot {
            width: 4px;
            height: 4px;
            background: black;
            position: absolute;
            top: 5rem;
            right: 5rem;
        }
    </style>
</head>

<body>

    <div class="v-line grid-line"></div>
    <div class="h-line grid-line"></div>

    <div class="container">
        <div class="void-shape">
            <span class="line">LESS</span>
            <span class="line">IS</span>
            <span class="line" style="color: transparent; -webkit-text-stroke: 1px black;">MORE.</span>
        </div>

        <div class="dot"></div>

        <div class="content">
            <p class="tiny-text">
                In a world of noise, silence is the ultimate luxury.
                We design digital experiences that breathe.
            </p>
            <a href="https://www.cuonghoa.website" class="cta">Enter the Void</a>
        </div>
    </div>

</body>

</html>
