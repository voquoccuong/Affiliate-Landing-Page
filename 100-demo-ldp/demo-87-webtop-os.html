<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #008080;
            /* Teal Win95 background */
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Desktop Icons */
        .desktop {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        .icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .icon-img {
            width: 32px;
            height: 32px;
            background: center/contain no-repeat;
        }

        .my-computer {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="20" height="14" rx="2" stroke="black"/><rect x="8" y="18" width="8" height="2" fill="black"/></svg>');
        }

        .trash-bin {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16l-2 14H6L4 6z" stroke="black"/><path d="M8 4h8v2H8V4z" fill="black"/></svg>');
        }

        .folder {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="%23FFE082" xmlns="http://www.w3.org/2000/svg"><path d="M2 6l2 12h16l2-12H2z" stroke="%23ffc107"/><path d="M2 6h8l2-2h8v2H2z" fill="%23ffc107"/></svg>');
        }

        .icon-text {
            color: white;
            font-size: 11px;
            text-align: center;
            text-shadow: 1px 1px 0 black;
        }

        .icon:hover .icon-text {
            background: #000080;
        }

        /* Window */
        .window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 500px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-btn {
            background: #c0c0c0;
            border: 1px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            width: 16px;
            height: 14px;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            cursor: pointer;
        }

        .menu-bar {
            display: flex;
            padding: 2px 5px;
            font-size: 11px;
            border-bottom: 1px solid #808080;
        }

        .menu-item {
            margin-right: 15px;
        }

        .menu-item span {
            text-decoration: underline;
        }

        .window-content {
            padding: 20px;
            background: white;
            border: 2px solid;
            border-color: #404040 #dfdfdf #dfdfdf #404040;
            margin: 2px;
            height: 250px;
            overflow-y: auto;
            font-size: 13px;
        }

        h1 {
            margin-top: 0;
        }

        .btn-modern {
            padding: 5px 15px;
            border: 2px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            background: #c0c0c0;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            color: black;
            display: inline-block;
            font-size: 11px;
        }

        .btn-modern:active {
            border-color: #404040 #dfdfdf #dfdfdf #404040;
        }

        /* Taskbar */
        .taskbar {
            height: 28px;
            background: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            display: flex;
            align-items: center;
            padding: 2px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .start-btn {
            height: 22px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 11px;
            margin-right: 10px;
            border: 2px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            cursor: pointer;
        }

        .start-btn img {
            width: 14px;
            height: 14px;
            background: black;
            /* logo placeholder */
        }

        .task-item {
            height: 22px;
            padding: 0 10px;
            background: #dfdfdf;
            /* pressed state: #e0e0e0 but inverted borders */
            border: 2px solid;
            border-color: #404040 #dfdfdf #dfdfdf #404040;
            /* Sunken */
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 150px;
        }

        .time-tray {
            margin-left: auto;
            border: 2px solid;
            border-color: #404040 #dfdfdf #dfdfdf #404040;
            padding: 2px 10px;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="desktop">
        <div class="icon">
            <div class="icon-img my-computer"></div>
            <div class="icon-text">My Computer</div>
        </div>
        <div class="icon">
            <div class="icon-img trash-bin"></div>
            <div class="icon-text">Recycle Bin</div>
        </div>
        <div class="icon">
            <div class="icon-img folder"></div>
            <div class="icon-text">Project X</div>
        </div>
    </div>

    <!-- Active Window -->
    <div class="window">
        <div class="title-bar">
            <span>Welcome.exe</span>
            <div style="display: flex; gap: 2px;">
                <div class="title-btn">_</div>
                <div class="title-btn">□</div>
                <div class="title-btn">X</div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item"><span>F</span>ile</div>
            <div class="menu-item"><span>E</span>dit</div>
            <div class="menu-item"><span>V</span>iew</div>
            <div class="menu-item"><span>H</span>elp</div>
        </div>
        <div class="window-content">
            <h1>Welcome to CuongHoa OS</h1>
            <p>This is a simulation of a classic desktop environment running entirely in your browser.</p>
            <p>Our solutions are compatible with all legacy and modern systems.</p>

            <a href="https://www.cuonghoa.website" class="btn-modern">Run Setup Wizard ></a>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">
            <img> <span>Start</span>
        </div>
        <div class="task-item">
            Welcome.exe
        </div>
        <div class="time-tray">
            11:59 PM
        </div>
    </div>

</body>

</html>
