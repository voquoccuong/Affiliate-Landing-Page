<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Parallax</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            scroll-behavior: smooth;
        }

        /* Scroll Snap Container */
        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .section {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Parallax Backgrounds */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6);
            transform: scale(1.1);
            /* Slight zoom for movement room */
            will-change: transform;
        }

        .content {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            z-index: 2;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease 0.3s;
        }

        /* Show content when section is active */
        .section:hover .content,
        /* Fallback */
        .section:focus-within .content {
            /* In a real app we'd use JS IntersectionObserver */
            /* For CSS-only demo, we'll auto-animate on load or use simple hover */
        }

        /* Simulating "In View" Animation with simple loop for demo purposes or just static */
        .content {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 6rem;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 1.5rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-outline {
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }

        .btn-outline:hover {
            background: white;
            color: black;
        }

        /* Dots Navigation */
        .dots {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot:hover {
            background: white;
        }

        /* Floating Badge */
        .badge {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>

<body>

    <div class="badge">CuongHoa.AI</div>

    <div class="dots">
        <a href="#s1" class="dot"></a>
        <a href="#s2" class="dot"></a>
        <a href="#s3" class="dot"></a>
        <a href="#s4" class="dot"></a>
    </div>

    <div class="snap-container">

        <!-- Section 1 -->
        <div id="s1" class="section">
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80"
                class="bg-image">
            <div class="content">
                <h1>The Future<br>Is Automated</h1>
                <p>Stop working manually. Start thinking in systems.</p>
                <div style="font-size: 3rem; margin-bottom: 20px;"><i class="ph-thin ph-arrow-down"></i></div>
            </div>
        </div>

        <!-- Section 2 -->
        <div id="s2" class="section">
            <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80"
                class="bg-image">
            <div class="content">
                <h1>Finance<br>Redefined</h1>
                <p>Real-time cash flow. Zero spreadsheet headaches.</p>
                <button class="btn-outline">VIEW DEMO</button>
            </div>
        </div>

        <!-- Section 3 -->
        <div id="s3" class="section">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80"
                class="bg-image">
            <div class="content">
                <h1>Content<br>At Scale</h1>
                <p>One idea. infinite distribution. Powered by AI.</p>
                <button class="btn-outline">SEE SYSTEM</button>
            </div>
        </div>

        <!-- Section 4 -->
        <div id="s4" class="section">
            <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80"
                class="bg-image">
            <div class="content">
                <h1>Join<br>The 1%</h1>
                <p>Get the full bundle. Lifetime access. Unfair advantage.</p>
                <button class="btn-outline" style="background:white; color:black;">GET ACCESS (2.9M)</button>
            </div>
        </div>

    </div>

    <script>
        // Simple parallax effect
        const container = document.querySelector('.snap-container');
        const bgs = document.querySelectorAll('.bg-image');

        container.addEventListener('scroll', () => {
            const scrollY = container.scrollTop;
            bgs.forEach((bg, index) => {
                // Calculate offset relative to the section position
                const speed = 0.5;
                const offset = (scrollY - (window.innerHeight * index)) * speed;
                bg.style.transform = `scale(1.1) translateY(${offset * 0.2}px)`;
            });
        });
    </script>

</body>

</html>
