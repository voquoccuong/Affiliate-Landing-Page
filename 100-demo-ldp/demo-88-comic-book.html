<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Book - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 2rem;
            background-color: #eee;
            /* Halftone pattern */
            background-image: radial-gradient(#ccc 20%, transparent 20%);
            background-size: 10px 10px;
            font-family: 'Comic Neue', cursive;
            display: flex;
            justify-content: center;
        }

        .comic-page {
            max-width: 1000px;
            width: 100%;
            background: white;
            border: 4px solid black;
            box-shadow: 10px 10px 0 black;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: 250px 300px;
            gap: 15px;
        }

        .panel {
            border: 4px solid black;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .panel:hover {
            transform: scale(1.02);
            box-shadow: 5px 5px 0 black;
            z-index: 10;
        }

        /* Panel Layout */
        .panel-1 {
            grid-column: 1 / 3;
            background: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Speed lines */
            background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0, 0, 0, 0.1) 12px, transparent 20px);
        }

        .panel-2 {
            background-image: url('https://images.unsplash.com/photo-1531297461136-82lw9f2a870d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(120%);
        }

        .panel-3 {
            background: #ff4757;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        /* Speech Bubbles */
        .speech-bubble {
            background: white;
            border: 3px solid black;
            border-radius: 50%;
            padding: 20px;
            position: relative;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20px;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: black transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 23px;
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        .caption-box {
            position: absolute;
            top: 0;
            left: 0;
            background: #fff;
            border-right: 3px solid black;
            border-bottom: 3px solid black;
            padding: 5px 10px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 5rem;
            color: #ff4757;
            text-shadow: 3px 3px 0 black;
            letter-spacing: 2px;
            margin: 0;
            transform: rotate(-3deg);
        }

        .action-text {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: white;
            -webkit-text-stroke: 2px black;
            position: absolute;
            bottom: 10px;
            right: 10px;
            transform: rotate(-10deg);
        }

        .btn-comic {
            background: white;
            border: 3px solid black;
            padding: 1rem 2rem;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            text-decoration: none;
            color: black;
            box-shadow: 5px 5px 0 black;
            margin-top: 1rem;
            transition: transform 0.1s;
        }

        .btn-comic:hover {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 black;
        }
    </style>
</head>

<body>

    <div class="comic-page">
        <!-- Panel 1: Hero Header -->
        <div class="panel panel-1">
            <div class="caption-box">Meanwhile...</div>
            <h1>THE GAME CHANGER!</h1>
            <div class="action-text">BOOM!</div>
        </div>

        <!-- Panel 2: Image -->
        <div class="panel panel-2">
            <div class="speech-bubble" style="position: absolute; top: 20px; right: 20px; width: 150px;">
                This new tech is incredible!
            </div>
        </div>

        <!-- Panel 3: CTA -->
        <div class="panel panel-3">
            <div class="speech-bubble" style="border-radius: 20px; margin-bottom: 20px;">
                <p style="margin:0; font-weight: bold; font-size: 1.2rem;">
                    Don't let your business stay in the past. Become the hero of your own story!
                </p>
            </div>
            <a href="https://www.cuonghoa.website" class="btn-comic">SAVE THE DAY!</a>
        </div>
    </div>

</body>

</html>
