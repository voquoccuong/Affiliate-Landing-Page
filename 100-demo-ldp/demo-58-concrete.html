<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Concrete</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Archivo+Black&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --concrete-bg: #d8d8d8;
            --concrete-dark: #808080;
            --text-color: #1a1a1a;
            --accent: #ff3333;
        }

        body {
            background-color: var(--concrete-bg);
            background-image: url('https://www.transparenttextures.com/patterns/concrete-wall.png');
            color: var(--text-color);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 2px;
            background: var(--text-color);
            /* Lines between grid items */
            border: 2px solid var(--text-color);
            margin: 40px;
        }

        .grid-item {
            background: var(--concrete-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .grid-item::before {
            content: "";
            /* Noise overlay */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/concrete-wall.png');
            opacity: 0.5;
            pointer-events: none;
        }

        /* Hero text spanning multiple columns */
        .hero {
            grid-column: span 8;
            grid-row: span 4;
            padding: 60px;
        }

        /* Image block */
        .visual {
            grid-column: span 4;
            grid-row: span 4;
            background: #000;
            overflow: hidden;
        }

        .visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .visual:hover img {
            opacity: 1;
        }

        /* Stat block */
        .stat {
            grid-column: span 3;
            grid-row: span 2;
            border-top: 5px solid var(--text-color);
        }

        /* CTA block */
        .action {
            grid-column: span 3;
            grid-row: span 2;
            background: var(--accent);
            color: white;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action:hover {
            background: #cc0000;
        }

        h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 6rem;
            text-transform: uppercase;
            line-height: 0.8;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        h2 {
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 600px;
        }

        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            border: 1px solid var(--text-color);
            padding: 2px 5px;
        }

        .coordinates {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .grid-container {
                display: flex;
                flex-direction: column;
            }

            .hero,
            .visual,
            .stat,
            .action {
                grid-column: auto;
                grid-row: auto;
                height: auto;
                min-height: 200px;
            }

            h1 {
                font-size: 4rem;
            }
        }
    </style>
</head>

<body>

    <div class="grid-container">

        <div class="grid-item hero">
            <div class="label">Structure_01</div>
            <h1>Raw<br>Power.</h1>
            <p>
                UNAPOLOGETIC AUTOMATION FOR THE MODERN ERA.
                STRIPPED OF ORNAMENTATION.
                PURE FUNCTIONALITY.
            </p>
            <div class="coordinates">LAT: 10.7769 | LONG: 106.7009</div>
        </div>

        <div class="grid-item visual">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"
                alt="Brutalist Architecture">
            <div class="label">Figure_A</div>
        </div>

        <div class="grid-item stat">
            <div class="label">Metric_X</div>
            <h2>500%</h2>
            <p>EFFICIENCY INCREASE</p>
        </div>

        <div class="grid-item stat">
            <div class="label">Metric_Y</div>
            <h2>0.02s</h2>
            <p>LATENCY</p>
        </div>

        <div class="grid-item stat">
            <div class="label">Metric_Z</div>
            <h2>10k+</h2>
            <p>UNITS DEPLOYED</p>
        </div>

        <a href="#" class="grid-item action" style="text-decoration: none;">
            <div class="label">Initiate</div>
            <h2>EXECUTE PLAN &rarr;</h2>
        </a>

    </div>

</body>

</html>
