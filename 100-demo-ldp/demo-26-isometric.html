<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Isometric</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', sans-serif;
            background-color: #2b2e4a;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            /* Hide scrollbars for the demo effect */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(43, 46, 74, 1), transparent);
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #e84545;
        }

        .intro {
            text-align: center;
            margin-top: 100px;
            margin-bottom: 50px;
            z-index: 10;
        }

        .intro h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .intro p {
            color: #bdc3c7;
        }

        /* Isometric Scene */
        .scene {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            margin-top: -50px;
        }

        .iso-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            transform: rotateX(60deg) rotateY(0deg) rotateZ(45deg);
            transform-style: preserve-3d;
        }

        .iso-card {
            width: 250px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .iso-card:hover {
            transform: translateZ(50px);
        }

        /* Cube Faces */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            backface-visibility: hidden;
        }

        /* Top Face (Main Content) */
        .face-top {
            background: #e84545;
            background-image: url('https://w.ladicdn.com/22603/image-20250909024310-u2yni.png');
            background-size: cover;
            transform: rotateX(0deg) translateZ(0px);
            /* Flat on top */
            border: 5px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Side Faces to creates 3D thickness */
        .face-thickness-1 {
            background: #903749;
            height: 20px;
            top: 100%;
            transform-origin: top;
            transform: rotateX(-90deg);
        }

        .face-thickness-2 {
            background: #53354a;
            width: 20px;
            left: 100%;
            transform-origin: left;
            transform: rotateY(90deg);
        }

        /* Shadow */
        .shadow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            transform: translateZ(-50px);
            filter: blur(20px);
            transition: all 0.3s;
        }

        .iso-card:hover .shadow {
            transform: translateZ(-100px);
            opacity: 0.3;
        }

        /* Content Overlay for Top Face */
        .card-content {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 10px;
            width: 100%;
        }

        .card-title {
            font-size: 1.2rem;
        }

        .card-sub {
            font-size: 0.8rem;
            color: #ccc;
        }

        /* Specific Card styles */
        .c1 .face-top {
            background-image: url('https://w.ladicdn.com/22603/image-13-20250909040425-zw_ho.png');
        }

        .c2 .face-top {
            background-image: url('https://w.ladicdn.com/22603/image-20250909024310-u2yni.png');
        }

        .c3 .face-top {
            background-image: url('https://w.ladicdn.com/22603/image-7-20250909032248-nxwdm.png');
        }

        .c4 .face-top {
            background-image: url('https://w.ladicdn.com/22603/image-20250909040425-zw_ho.png');
        }

        .c5 .face-top {
            background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60');
        }

        .c6 .face-top {
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60');
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">CuongHoa.AI</div>
        <button
            style="background:white; color:#2b2e4a; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; cursor:pointer;">Get
            Full Access</button>
    </div>

    <div class="intro">
        <h1>Building Blocks of Success</h1>
        <p>Hover over the modules to interact.</p>
    </div>

    <div class="scene">
        <div class="iso-grid">

            <!-- Card 1 -->
            <div class="iso-card c1">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">Mindset</div>
                        <div class="card-sub">Foundation Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

            <!-- Card 2 -->
            <div class="iso-card c2">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">Finance</div>
                        <div class="card-sub">Automation Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

            <!-- Card 3 -->
            <div class="iso-card c3">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">Content</div>
                        <div class="card-sub">Growth Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

            <!-- Card 4 -->
            <div class="iso-card c4">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">LadiPage</div>
                        <div class="card-sub">Conversion Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

            <!-- Card 5 -->
            <div class="iso-card c5">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">Sales</div>
                        <div class="card-sub">Revenue Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

            <!-- Card 6 -->
            <div class="iso-card c6">
                <div class="shadow"></div>
                <div class="face face-top">
                    <div class="card-content">
                        <div class="card-title">Systems</div>
                        <div class="card-sub">Ops Level</div>
                    </div>
                </div>
                <div class="face face-thickness-1"></div>
                <div class="face face-thickness-2"></div>
            </div>

        </div>
    </div>

</body>

</html>
