<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Collage</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rock+Salt&family=Special+Elite&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/crinkled-paper.png');
        }

        .collage-board {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            background: #e0e0e0;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            /* Corkboard or Cutting mat texture could replace this color */
            overflow: hidden;
        }

        /* Scraps of paper */
        .scrap {
            position: absolute;
            background: white;
            padding: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .scrap:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 100 !important;
        }

        /* Tape effect */
        .tape {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            height: 30px;
            width: 100px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transform: rotate(-45deg);
            z-index: 10;
        }

        /* Elements */
        .title-scrap {
            top: 10%;
            left: 10%;
            transform: rotate(-5deg);
            background: #ffeb3b;
            font-family: 'Permanent Marker', cursive;
            font-size: 3rem;
            color: #d50000;
            /* Ripped edge effect (simplified) */
            clip-path: polygon(0% 0%, 100% 2%, 98% 98%, 2% 95%);
        }

        .title-scrap .tape {
            top: -10px;
            left: 40%;
            width: 60px;
            transform: rotate(5deg);
            opacity: 0.7;
        }

        .img-scrap {
            top: 20%;
            right: 15%;
            transform: rotate(3deg);
            padding: 10px 10px 40px 10px;
            /* Polaroid style */
            background: #fff;
            width: 300px;
        }

        .img-scrap img {
            width: 100%;
            filter: sepia(50%) contrast(120%);
        }

        .img-scrap .caption {
            font-family: 'Rock Salt', cursive;
            font-size: 0.8rem;
            margin-top: 10px;
            text-align: center;
        }

        .img-scrap .tape {
            top: -15px;
            right: 80px;
            transform: rotate(-5deg);
            background: rgba(255, 0, 0, 0.3);
        }

        .text-scrap {
            bottom: 15%;
            left: 20%;
            transform: rotate(2deg);
            width: 350px;
            background-color: #fce4ec;
            font-family: 'Special Elite', monospace;
            font-size: 1.1rem;
            line-height: 1.4;
            clip-path: polygon(2% 2%, 99% -1%, 98% 99%, 1% 97%);
        }

        .text-scrap .tape {
            top: -10px;
            left: 10px;
            transform: rotate(85deg);
            height: 40px;
            width: 25px;
        }

        .cta-scrap {
            bottom: 25%;
            right: 10%;
            transform: rotate(-8deg);
            background: #000;
            color: #fff;
            padding: 15px 30px;
            cursor: pointer;
        }

        .cta-scrap a {
            color: white;
            text-decoration: none;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .cta-scrap:hover {
            background: #333;
        }

        /* Ransom note style helper (not fully implemented due to complexity, sticking to scraps) */

        .sticker {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.3));
        }

        .s1 {
            top: 5%;
            right: 30%;
            transform: rotate(15deg);
        }

        .s2 {
            bottom: 10%;
            left: 5%;
            transform: rotate(-20deg);
            font-size: 5rem;
            opacity: 0.2;
        }
    </style>
</head>

<body>

    <div class="collage-board">

        <div class="scrap title-scrap">
            <div class="tape"></div>
            MAKE IT<br>YOUR OWN
        </div>

        <div class="scrap img-scrap">
            <div class="tape"></div>
            <img src="https://images.unsplash.com/photo-1598153346810-860daa812c4b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                alt="Graffiti Art">
            <div class="caption">Fig. 1: Controlled Chaos</div>
        </div>

        <div class="scrap text-scrap">
            <div class="tape"></div>
            <p>
                Forget the grid. Forget the rules.
                Automation doesn't have to be rigid.
                Mix, match, and patch together a workflow
                that actually fits your messy, creative life.
            </p>
        </div>

        <div class="scrap cta-scrap">
            <div class="tape" style="top: -10px; right: 40%; width: 50px; background: rgba(255,255,0,0.5);"></div>
            <a href="#">Remix Now</a>
        </div>

        <div class="sticker s1">★</div>
        <div class="sticker s2">✖</div>

    </div>

</body>

</html>
