<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI - Masonry</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff;
            color: #333;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 0 60px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e60023;
            /* Pinterest Red-ish */
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar {
            max-width: 600px;
            margin: 0 auto;
            background: #f1f1f1;
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            color: #666;
            font-weight: 500;
        }

        .search-bar i {
            font-size: 1.2rem;
            margin-right: 15px;
        }

        /* DIY CSS Masonry */
        .masonry-grid {
            column-count: 4;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .pin-card {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 20px;
            /* Highly rounded */
            overflow: hidden;
            position: relative;
            cursor: pointer;
            /* Zoom cursor */
            transition: opacity 0.2s;
        }

        .pin-card img {
            width: 100%;
            display: block;
            transition: filter 0.2s;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .pin-card:hover .overlay {
            opacity: 1;
        }

        .save-btn {
            align-self: flex-end;
            background: #e60023;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .overlay-links {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.9);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 1.2rem;
        }

        /* Text below card */
        .card-info {
            padding: 10px 5px;
        }

        .card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 5px;
            color: #111;
        }

        .card-meta {
            font-size: 0.85rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ddd;
        }

        @media (max-width: 1100px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        @media (max-width: 800px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 500px) {
            .masonry-grid {
                column-count: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <i class="ph-fill ph-pinterest-logo"></i> CuongHoa.AI
        </div>
        <div class="search-bar">
            <i class="ph-bold ph-magnifying-glass"></i>
            Search for "automation courses"
        </div>
    </header>

    <div class="masonry-grid">

        <!-- Pin 1 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb7d5fa5?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                    alt="Nature">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                    <div class="overlay-links">
                        <div class="icon-btn"><i class="ph-bold ph-arrow-up-right"></i></div>
                        <div class="icon-btn"><i class="ph-bold ph-dots-three"></i></div>
                    </div>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Automation Mindset</div>
                <div class="card-meta">
                    <div class="avatar"></div> CuongHoa.AI
                </div>
            </div>
        </div>

        <!-- Pin 2 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <!-- Taller image -->
                <img src="https://w.ladicdn.com/22603/image-20250909024310-u2yni.png" alt="Finance">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                    <div class="overlay-links">
                        <div class="icon-btn"><i class="ph-bold ph-arrow-up-right"></i></div>
                    </div>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Finance Bot v2.0</div>
                <div class="card-meta">
                    <div class="avatar"></div> 1.9M Views
                </div>
            </div>
        </div>

        <!-- Pin 3 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <img src="https://w.ladicdn.com/22603/image-7-20250909032248-nxwdm.png" alt="Content">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Content Automation</div>
                <div class="card-meta">
                    <div class="avatar"></div> Trending
                </div>
            </div>
        </div>

        <!-- Pin 4 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                    alt="Tech">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Cyber Systems</div>
                <div class="card-meta">
                    <div class="avatar"></div> Promoted
                </div>
            </div>
        </div>

        <!-- Pin 5 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <img src="https://w.ladicdn.com/22603/image-13-20250909040425-zw_ho.png" alt="Mindset">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Unlock Potential</div>
                <div class="card-meta">
                    <div class="avatar"></div> Recommended
                </div>
            </div>
        </div>

        <!-- Pin 6 -->
        <div class="pin-wrapper">
            <div class="pin-card">
                <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80"
                    alt="Code">
                <div class="overlay">
                    <button class="save-btn">Save</button>
                </div>
            </div>
            <div class="card-info">
                <div class="card-title">Code Newbie</div>
                <div class="card-meta">
                    <div class="avatar"></div> 5k Saves
                </div>
            </div>
        </div>

    </div>

</body>

</html>
