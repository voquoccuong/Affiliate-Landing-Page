<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Station - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --space-black: #0B0E14;
            --panel-grey: #1F2933;
            --hologram-blue: #00F0FF;
            --alert-red: #FF2A2A;
            --star-white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--space-black);
            color: var(--hologram-blue);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%);
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 10% 10%, white 100%, transparent),
                radial-gradient(1px 1px at 20% 40%, white 100%, transparent),
                radial-gradient(2px 2px at 50% 50%, white 100%, transparent),
                radial-gradient(1px 1px at 80% 80%, white 100%, transparent);
            background-size: 300px 300px;
            opacity: 0.5;
        }

        /* Earth Viewport */
        .viewport {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh;
            height: 80vh;
            border-radius: 50%;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            box-shadow:
                inset 0 0 100px rgba(0, 0, 0, 0.9),
                0 0 50px rgba(0, 100, 255, 0.2);
            z-index: 1;
            border: 20px solid var(--panel-grey);
        }

        .viewport::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
        }

        /* HUD overlay */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .hud-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px dashed var(--hologram-blue);
            border-radius: 50%;
            opacity: 0.3;
        }

        .ring-1 {
            width: 85vh;
            height: 85vh;
            border-width: 2px;
            animation: rotate 60s linear infinite;
        }

        .ring-2 {
            width: 100vh;
            height: 100vh;
            border-style: dotted;
            animation: rotate-rev 120s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes rotate-rev {
            from {
                transform: translate(-50%, -50%) rotate(360deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        /* UI Panels */
        .panel {
            position: absolute;
            background: rgba(11, 14, 20, 0.85);
            border: 1px solid var(--hologram-blue);
            padding: 2rem;
            backdrop-filter: blur(5px);
            z-index: 20;
            pointer-events: auto;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .panel-left {
            top: 20%;
            left: 5%;
            width: 300px;
        }

        .panel-right {
            bottom: 20%;
            right: 5%;
            width: 300px;
            text-align: right;
            border-color: var(--alert-red);
            color: var(--alert-red);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .btn-launch {
            background: transparent;
            border: 1px solid var(--hologram-blue);
            color: var(--hologram-blue);
            padding: 10px 30px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-launch:hover {
            background: var(--hologram-blue);
            color: black;
            box-shadow: 0 0 20px var(--hologram-blue);
        }

        .data-stream {
            font-family: monospace;
            font-size: 0.8rem;
            opacity: 0.5;
            position: absolute;
            bottom: 2rem;
            left: 2rem;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="viewport"></div>

    <div class="hud-layer">
        <div class="hud-ring ring-1"></div>
        <div class="hud-ring ring-2"></div>
    </div>

    <div class="panel panel-left">
        <h1>Orbital Link</h1>
        <p>Satellite internet connectivity with 99.99% uptime. The future of communication is above the clouds.</p>
        <a href="https://www.cuonghoa.website" class="btn-launch">Initiate Uplink</a>
    </div>

    <div class="panel panel-right">
        <h1>Status</h1>
        <p>
            ALT: 400km <br>
            VEL: 7.66 km/s <br>
            O2: NOMINAL
        </p>
        <div style="height: 5px; background: rgba(255,0,0,0.3); width: 100%; margin-top: 10px;">
            <div style="height: 100%; background: var(--alert-red); width: 85%;"></div>
        </div>
    </div>

    <div class="data-stream">
        RX: 45.209.30<br>
        TX: 99.102.33<br>
        PKT: 0.0001% LOSS
    </div>

</body>

</html>
