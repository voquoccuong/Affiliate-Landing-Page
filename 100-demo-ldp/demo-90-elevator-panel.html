<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator - CuongHoa.AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Orbitron:wght@600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #222;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            background-image:
                linear-gradient(90deg, #1a1a1a 50%, #222 50%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px, 20px 20px;
        }

        .panel-plate {
            background: linear-gradient(135deg, #d0d0d0, #f0f0f0);
            width: 250px;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow:
                0 0 0 2px #999,
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                20px 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Floor Indicator */
        .floor-display {
            background: black;
            width: 100%;
            height: 80px;
            border-radius: 4px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            border: 2px solid #555;
            position: relative;
        }

        .floor-display::after {
            content: '▲';
            position: absolute;
            right: 15px;
            font-size: 1.5rem;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }

        /* Buttons Grid */
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
        }

        .elevator-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e0e0e0;
            border: 4px solid #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: #555;
            cursor: pointer;
            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.8);
            transition: all 0.2s;
            position: relative;
        }

        .elevator-btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        /* Active/Lit state */
        .selected {
            box-shadow:
                0 0 20px rgba(255, 200, 100, 0.8),
                inset 0 0 20px rgba(255, 200, 100, 0.5);
            background: #fff5e6;
            border-color: #ffcc00;
            color: #cc8800;
        }

        .selected::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid rgba(255, 200, 0, 0.5);
            filter: blur(2px);
        }

        /* Braille simulation */
        .braille {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            pointer-events: none;
        }

        .dot {
            width: 4px;
            height: 4px;
            background: #999;
            border-radius: 50%;
        }

        .logo-plate {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 2px;
            border-top: 1px solid #aaa;
            padding-top: 10px;
            width: 100%;
            text-align: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="panel-plate">
        <div class="floor-display">100</div>

        <div class="buttons-grid">
            <div class="btn-wrapper">
                <a href="#" class="elevator-btn">1</a>
            </div>
            <div class="btn-wrapper">
                <a href="#" class="elevator-btn">2</a>
            </div>

            <div class="btn-wrapper">
                <a href="#" class="elevator-btn">3</a>
            </div>
            <div class="btn-wrapper">
                <a href="#" class="elevator-btn">4</a>
            </div>

            <div class="btn-wrapper" style="grid-column: span 2;">
                <!-- Main CTA Button -->
                <a href="https://www.cuonghoa.website" class="elevator-btn selected"
                    style="width: 100px; height: 100px; font-size: 2rem;">
                    MAX
                </a>
            </div>
        </div>

        <div class="logo-plate">OTIS / SCHINDLER</div>
    </div>

</body>

</html>
