<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuongHoa.AI // AURA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { 'glass-surface': 'rgba(255, 255, 255, 0.05)', 'glass-border': 'rgba(255, 255, 255, 0.1)' },
                    animation: { 'float': 'float 6s ease-in-out infinite', 'blob': 'blob 15s infinite' },
                    keyframes: {
                        float: { '0%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' }, '100%': { transform: 'translateY(0)' } },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            overflow-x: hidden;
        }

        .aura-bg {
            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.2), transparent 40%), radial-gradient(circle at 90% 50%, rgba(168, 85, 247, 0.2), transparent 40%), radial-gradient(circle at 30% 80%, rgba(236, 72, 153, 0.2), transparent 40%);
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body class="aura-bg min-h-screen selection:bg-purple-500 selection:text-white">

    <div class="fixed inset-0 z-[-1] pointer-events-none">
        <div
            class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-purple-900/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob">
        </div>
        <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-blue-900/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob"
            style="animation-delay: 2s"></div>
    </div>

    <nav class="fixed top-0 left-0 right-0 z-50 p-6 flex justify-center">
        <div class="glass-panel px-8 py-4 rounded-full flex items-center gap-10">
            <span class="text-xl font-bold tracking-tight text-white flex items-center gap-2">CuongHoa.AI</span>
            <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-300">
                <a href="#courses" class="hover:text-white transition-all">Courses</a>
                <a href="#community" class="hover:text-white transition-all">Community</a>
            </div>
            <a href="#"
                class="bg-white/10 hover:bg-white/20 text-white px-5 py-2 rounded-full text-sm font-semibold transition-all">Access
                V-Class</a>
        </div>
    </nav>

    <main class="relative pt-40 pb-20 px-6">
        <div class="container mx-auto text-center relative z-10">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel mb-8 animate-float">
                <span class="w-2 h-2 rounded-full bg-green-400"></span><span
                    class="text-xs font-semibold uppercase text-gray-300">New Cohort Open</span>
            </div>
            <h1 class="text-6xl md:text-8xl font-extrabold mb-8 tracking-tight leading-none">
                <span class="block text-transparent bg-clip-text bg-gradient-to-b from-white to-white/50">Future of
                    Work</span>
                <span class="block text-4xl md:text-6xl font-light text-gray-400 mt-2">Is Automated.</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-12 font-light">Master No-Code Automation with n8n,
                Lark, and Make. Build systems that scale while you sleep.</p>
            <div class="flex justify-center gap-6">
                <button
                    class="px-8 py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full text-white font-bold text-lg hover:shadow-lg transition-all">Start
                    Learning</button>
                <button
                    class="px-8 py-4 glass-panel rounded-full text-white font-semibold hover:bg-white/5 transition-all">Watch
                    Trailer</button>
            </div>
        </div>
    </main>

    <section id="courses" class="py-24 relative">
        <div class="container mx-auto px-6 relative z-10">
            <h2 class="text-4xl md:text-5xl font-bold mb-16 text-center">Curated Learning Paths</h2>
            <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </section>

    <footer class="pt-20 pb-10 border-t border-white/5 text-center text-gray-500 text-sm">
        <p>&copy; 2025 CuongHoa.AI. All rights reserved.</p>
    </footer>

    <script>
        lucide.createIcons();
        const courseData = {
            "courses": [
                { "title": "[S01] Automation Overview", "description": "Foundations and mindset for automation engineers.", "price": 2900000, "tools": ["Mindset"], "featureImage": "https://w.ladicdn.com/22603/image-13-20250909040425-zw_ho.png", "productURL": "https://go.cuonghoa.ai/s01" },
                { "title": "[S02] Banking Watchdog", "description": "Real-time financial tracking and reporting via API.", "price": 1900000, "tools": ["SePay", "Lark"], "featureImage": "https://w.ladicdn.com/22603/image-20250909024310-u2yni.png", "productURL": "https://go.cuonghoa.ai/s02" },
                { "title": "[S03] Revenue Ops Core", "description": "E-commerce synchronization and lean operations.", "price": 2900000, "tools": ["Wordpress", "Lark"], "featureImage": "https://w.ladicdn.com/22603/image-1-20250909024623-nawlw.png", "productURL": "https://go.cuonghoa.ai/s03" },
                { "title": "[S04] Contract & Debt Auto", "description": "Automated billing and debt collection management.", "price": 4900000, "tools": ["Lark", "n8n"], "featureImage": "https://w.ladicdn.com/22603/image-2-20250909024738-jshlc.png", "productURL": "https://go.cuonghoa.ai/s04" },
                { "title": "[S05] Social Distribution", "description": "Automated content scheduling for Zalo and Facebook.", "price": 2900000, "tools": ["Make", "Facebook"], "featureImage": "https://w.ladicdn.com/22603/image-3-20250909025510-8mrrg.png", "productURL": "https://go.cuonghoa.ai/s05" },
                { "title": "[S06] Shopee Feedback Loop", "description": "Negative review interception and CSKH handling.", "price": 3900000, "tools": ["Shopee", "n8n"], "featureImage": "https://w.ladicdn.com/22603/image-4-20250909025943-0n2dg.png", "productURL": "https://go.cuonghoa.ai/s06" }
            ]
        };
        const grid = document.getElementById('course-grid');
        function formatPrice(price) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price); }
        function createCard(course) {
            return `
                <div class="glass-panel rounded-3xl p-5 hover:bg-white/10 transition-all duration-500 group flex flex-col h-full hover:-translate-y-2">
                    <div class="relative h-56 rounded-2xl overflow-hidden mb-6">
                        <img src="${course.featureImage}" alt="${course.title}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        <div class="absolute top-3 right-3 flex gap-1">${course.tools.map(t => `<div class="bg-black/50 px-2 py-1 rounded text-[10px] uppercase font-bold text-white">${t}</div>`).join('')}</div>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <h3 class="text-2xl font-bold mb-3 text-white group-hover:text-purple-300 transition-colors">${course.title}</h3>
                        <p class="text-gray-400 text-sm mb-6 flex-1">${course.description}</p>
                        <div class="mt-auto pt-6 border-t border-white/10 flex items-center justify-between">
                            <span class="text-xl font-bold text-purple-300">${formatPrice(course.price)}</span>
                            <a href="${course.productURL}" target="_blank" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:bg-purple-400 hover:text-white transition-all"><i data-lucide="arrow-up-right" class="w-5 h-5"></i></a>
                        </div>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = courseData.courses.map(createCard).join('');
    </script>
</body>

</html>
